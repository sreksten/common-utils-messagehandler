trace=Trace
exception=Exception

# FileMessageHandler messages
fileWriteError=I/O error detected after writing to log file; some messages may have been lost.
fileRotationError=Log file rotation failed; some messages may have been lost.
fileReopenError=Failed to re-open log file after external rotation; some messages may be lost.

